<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uninter - Portal do Aluno</title>
<style>
:root{
  --blue-900:#1a3a63; --blue-700:#2f5c8f; --blue-600:#3a74ad; --blue-500:#4a90c9;
  --blue-50:#eaf2fa; --orange:#f5a623; --bg:#f4f6f9; --card:#ffffff; --text:#2b3645;
  --muted:#6b7a8d; --border:#dde4ec;
  color-scheme: light;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
a{text-decoration:none; color:inherit; cursor:pointer;}
button{font-family:inherit; cursor:pointer;}

/* Header */
header{background:linear-gradient(90deg,var(--blue-900),var(--blue-700)); color:#fff;
  display:flex; align-items:center; justify-content:space-between; padding:14px 24px;
  position:sticky; top:0; z-index:50;}
.brand{display:flex; align-items:center; gap:10px; font-size:22px; font-weight:bold;}
.brand .dot{width:28px; height:28px; border-radius:6px; background:var(--orange); display:inline-block;}
.header-right{display:flex; align-items:center; gap:28px; font-size:13px;}
.header-item{display:flex; flex-direction:column; align-items:center; gap:2px; position:relative;}
.hic svg{width:18px; height:18px; fill:none; stroke:#fff; stroke-width:1.8;}
.badge{position:absolute; top:-6px; right:-10px; background:#e0453c; color:#fff; border-radius:10px;
  font-size:10px; padding:1px 5px;}
.profile-chip{display:flex; align-items:center; gap:8px;}
.avatar{width:30px; height:30px; border-radius:50%; background:#cdd9e6; display:flex; align-items:center;
  justify-content:center; font-size:12px; color:var(--blue-900); font-weight:bold; overflow:hidden;}
.menu-btn{display:none; background:none; border:none; color:#fff; font-size:22px;}

/* Layout */
.layout{display:flex; min-height:calc(100vh - 60px);}
.sidebar{width:250px; background:var(--card); border-right:1px solid var(--border); padding:18px;
  flex-shrink:0;}
.sidebar-banner{height:90px; border-radius:8px; background:linear-gradient(135deg,var(--blue-700),var(--blue-900));
  position:relative; margin-bottom:-35px;}
.sidebar-profile{text-align:center; padding-top:55px; padding-bottom:16px; border-bottom:1px solid var(--border);}
.sidebar-avatar{width:70px; height:70px; border-radius:50%; background:#cdd9e6; margin:0 auto 8px;
  display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--blue-900);
  font-weight:bold; border:3px solid #fff; box-shadow:0 0 0 1px var(--border);}
.sidebar-name{font-weight:bold; font-size:14px;}
.sidebar-ru{font-size:12px; color:var(--muted);}
.sidebar-edit{font-size:12px; color:var(--blue-600); margin-top:4px; display:inline-block;}
.nav-group{margin-top:16px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; font-size:14px;
  color:var(--text); margin-bottom:2px;}
.nav-item .ic{width:20px; text-align:center;}
.nav-item .ic svg, .mini-card .ic svg{width:18px; height:18px; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8;}
.mini-card .ic svg{width:26px; height:26px;}
.nav-item:hover{background:var(--blue-50);}
.nav-item.active{background:var(--blue-50); color:var(--blue-700); font-weight:bold; border-left:3px solid var(--blue-600);}

.main{flex:1; padding:24px; min-width:0;}
.page-title{font-size:22px; color:var(--blue-900); font-weight:bold; letter-spacing:.5px;
  border-bottom:2px solid var(--border); padding-bottom:12px; margin-bottom:18px;}

.tabs{display:flex; gap:4px; margin-bottom:18px;}
.tab{padding:10px 18px; border-radius:6px 6px 0 0; background:var(--blue-50); color:var(--blue-700);
  font-size:13px; font-weight:bold; border:1px solid var(--border); border-bottom:none;}
.tab.active{background:var(--blue-700); color:#fff;}

.card{background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; overflow:hidden;}
.card-header{background:var(--blue-50); padding:12px 18px; font-weight:bold; color:var(--blue-800,#1a3a63); font-size:15px;}
.card-body{padding:18px;}
.notice{background:var(--blue-50); border:1px solid #c9ddee; color:var(--blue-700); border-radius:6px;
  padding:14px 16px; font-size:13px; margin-bottom:18px; line-height:1.5;}

.field-row{display:flex; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.field-row label{width:170px; font-size:13px; color:var(--muted); flex-shrink:0;}
.field-row input, .field-row select{flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--border);
  border-radius:5px; font-size:13px; background:#fafcfe;}
.field-row input:disabled{color:var(--muted); background:#f0f2f5;}

.btn{padding:9px 18px; border-radius:5px; border:none; font-size:13px; font-weight:bold;}
.btn-primary{background:var(--blue-700); color:#fff;}
.btn-primary:hover{background:var(--blue-900);}
.btn-link{color:var(--blue-600); background:none; font-size:13px; text-decoration:underline;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
.mini-card{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; text-align:center;}
.mini-card .ic{font-size:30px; margin-bottom:8px;}
.mini-card .lbl{font-size:13px; font-weight:bold; color:var(--blue-900);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{background:var(--blue-50); text-align:left; padding:10px 12px; color:var(--blue-900); font-size:12px;}
td{padding:10px 12px; border-top:1px solid var(--border);}
tr:hover td{background:#fafcfe;}
.pill{padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold;}
.pill-ok{background:#e3f6e8; color:#2a8a4a;}
.pill-pend{background:#fdf0da; color:#b57b12;}
.pill-late{background:#fbe4e2; color:#c0392b;}

.msg-item{display:flex; justify-content:space-between; padding:12px; border-top:1px solid var(--border); font-size:13px;}
.msg-item:first-child{border-top:none;}
.msg-unread{font-weight:bold;}

.toast{position:fixed; bottom:20px; right:20px; background:var(--blue-900); color:#fff; padding:12px 20px;
  border-radius:6px; font-size:13px; opacity:0; transform:translateY(10px); transition:.25s; z-index:200;}
.toast.show{opacity:1; transform:translateY(0);}

@media (max-width:860px){
  .menu-btn{display:block;}
  .header-right .header-item span:not(.badge){display:none;}
  .sidebar{position:fixed; left:-270px; top:60px; bottom:0; z-index:100; transition:.25s; box-shadow:2px 0 10px rgba(0,0,0,.15);}
  .sidebar.open{left:0;}
  .field-row label{width:100%;}
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div class="brand"><span class="dot"></span>Uninter</div>
  <div class="header-right">
    <div class="header-item"><span class="hic" id="bellIcon"></span><span>Avisos</span><span class="badge">1</span></div>
    <div class="header-item"><span class="hic" id="chatIcon"></span><span>Mensagens</span><span class="badge">8</span></div>
    <div class="profile-chip">
      <div class="avatar">BH</div>
      <div style="line-height:1.1"><div style="font-weight:bold">BRUNO HENRIQUE DERAÚJO</div>
        <div style="font-size:11px; opacity:.85">RU: 0004521</div></div>
    </div>
    <span style="font-size:18px">⚙️</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-banner"></div>
    <div class="sidebar-profile">
      <div class="sidebar-avatar">BH</div>
      <div class="sidebar-name">Bruno Henrique Deraújo</div>
      <div class="sidebar-ru">RU: 0004521</div>
      <a class="sidebar-edit" onclick="goPage('configuracoes')">✎ configurações</a>
    </div>
    <div class="nav-group" id="navGroup"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'Uninter_proto_state';
let state = JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || {
  tema: 'Tema padrão',
  prefs: { emailNotif:true, smsNotif:false, idioma:'Português' },
  page: 'inicio'
};
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

const SVG = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  cap:'<svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 4h9a3 3 0 013 3v13H7a3 3 0 00-3 3V4z"/><path d="M20 4v16"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v11H3z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M14 4l6 6-10 10H4v-6z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>',
  calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>'
};
const NAV = [
  {id:'inicio', ic:SVG.home, label:'Página Inicial'},
  {id:'meucurso', ic:SVG.cap, label:'Meu Curso'},
  {id:'disciplinas', ic:SVG.book, label:'Disciplinas'},
  {id:'materiais', ic:SVG.folder, label:'Materiais de Estudo'},
  {id:'atividades', ic:SVG.edit, label:'Atividades'},
  {id:'avaliacoes', ic:SVG.check, label:'Avaliações'},
  {id:'notas', ic:SVG.chart, label:'Notas e Desempenho'},
  {id:'calendario', ic:SVG.calendar, label:'Calendário Acadêmico'},
  {id:'mensagens', ic:SVG.chat, label:'Mensagens e Comunicados'},
  {id:'perfil', ic:SVG.user, label:'Perfil do Estudante'},
  {id:'configuracoes', ic:SVG.gear, label:'Configurações'},
];

function renderNav(){
  document.getElementById('navGroup').innerHTML = NAV.map(n =>
    `<a class="nav-item ${state.page===n.id?'active':''}" onclick="goPage('${n.id}')">
      <span class="ic">${n.ic}</span>${n.label}</a>`).join('');
}

function goPage(id){
  state.page = id; save();
  document.getElementById('sidebar').classList.remove('open');
  renderNav();
  renderMain();
}

const DISCIPLINAS = [
  {nome:'Gestão de Agronegócios', prof:'Profa. Elaine Souza', prog:72},
  {nome:'Sensoriamento Remoto Aplicado', prof:'Prof. Ivo Campos', prog:45},
  {nome:'Bioinformática Básica', prof:'Profa. Renata Alves', prog:90},
  {nome:'Estatística Experimental', prof:'Prof. Caio Figueira', prog:30},
];

const ATIVIDADES = [
  {disc:'Gestão de Agronegócios', titulo:'Estudo de caso - Cooperativas', prazo:'10/11/2026', status:'pend'},
  {disc:'Bioinformática Básica', titulo:'Exercício - Alinhamento de sequências', prazo:'05/11/2026', status:'late'},
  {disc:'Sensoriamento Remoto', titulo:'Relatório NDVI', prazo:'18/11/2026', status:'ok'},
  {disc:'Estatística Experimental', titulo:'Lista 4 - ANOVA', prazo:'22/11/2026', status:'pend'},
];

const NOTAS = [
  {disc:'Gestão de Agronegócios', nota:8.4},
  {disc:'Sensoriamento Remoto Aplicado', nota:7.1},
  {disc:'Bioinformática Básica', nota:9.0},
  {disc:'Estatística Experimental', nota:6.5},
];

const MENSAGENS = [
  {de:'Secretaria Acadêmica', assunto:'Confirmação de matrícula no semestre', lida:false},
  {de:'Prof. Ivo Campos', assunto:'Material complementar - aula 6', lida:false},
  {de:'Coordenação do Curso', assunto:'Pesquisa de satisfação', lida:true},
  {de:'Suporte Uninter', assunto:'Atualização da plataforma', lida:true},
];

function pillStatus(s){
  if(s==='ok') return '<span class="pill pill-ok">Entregue</span>';
  if(s==='pend') return '<span class="pill pill-pend">Pendente</span>';
  return '<span class="pill pill-late">Atrasada</span>';
}

function renderMain(){
  const m = document.getElementById('main');
  const nav = NAV.find(n=>n.id===state.page);
  let html = `<div class="page-title">${nav.label.toUpperCase()}</div>`;

  if(state.page==='inicio'){
    html += `<div class="notice">Bem-vindo de volta, Bruno! Você tem <b>2 atividades pendentes</b> e <b>2 mensagens não lidas</b>.</div>
    <div class="grid-cards">
      ${NAV.filter(n=>!['inicio','configuracoes','perfil'].includes(n.id)).map(n=>
        `<a class="mini-card" onclick="goPage('${n.id}')"><div class="ic">${n.ic}</div><div class="lbl">${n.label}</div></a>`).join('')}
    </div>`;
  }

  else if(state.page==='meucurso'){
    html += `<div class="card"><div class="card-header">Resumo do Curso</div><div class="card-body">
      <div class="field-row"><label>Curso</label><input disabled value="Tecnólogo em Agronegócio"></div>
      <div class="field-row"><label>Modalidade</label><input disabled value="Educação a Distância"></div>
      <div class="field-row"><label>Período atual</label><input disabled value="5º período"></div>
      <div class="field-row"><label>Progresso geral</label><input disabled value="68% concluído"></div>
    </div></div>`;
  }

  else if(state.page==='disciplinas'){
    html += `<div class="card"><div class="card-body" style="padding:0">
      <table><tr><th>Disciplina</th><th>Professor(a)</th><th>Progresso</th></tr>
      ${DISCIPLINAS.map(d=>`<tr><td>${d.nome}</td><td>${d.prof}</td><td>${d.prog}%</td></tr>`).join('')}
      </table></div></div>`;
  }

  else if(state.page==='materiais'){
    html += `<div class="grid-cards">
      ${DISCIPLINAS.map(d=>`<div class="mini-card"><div class="ic">📄</div><div class="lbl">${d.nome}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">3 arquivos disponíveis</div></div>`).join('')}
    </div>`;
  }

  else if(state.page==='atividades'){
    html += `<div class="card"><div class="card-body" style="padding:0">
      <table><tr><th>Disciplina</th><th>Atividade</th><th>Prazo</th><th>Status</th></tr>
      ${ATIVIDADES.map(a=>`<tr><td>${a.disc}</td><td>${a.titulo}</td><td>${a.prazo}</td><td>${pillStatus(a.status)}</td></tr>`).join('')}
      </table></div></div>`;
  }

  else if(state.page==='avaliacoes'){
    html += `<div class="card"><div class="card-header">Próximas Avaliações</div><div class="card-body" style="padding:0">
      <table><tr><th>Disciplina</th><th>Data</th><th>Tipo</th></tr>
      <tr><td>Gestão de Agronegócios</td><td>14/11/2026</td><td>Prova online</td></tr>
      <tr><td>Estatística Experimental</td><td>20/11/2026</td><td>Prova discursiva</td></tr>
      </table></div></div>`;
  }

  else if(state.page==='notas'){
    html += `<div class="card"><div class="card-body" style="padding:0">
      <table><tr><th>Disciplina</th><th>Média</th><th>Situação</th></tr>
      ${NOTAS.map(n=>`<tr><td>${n.disc}</td><td>${n.nota.toFixed(1)}</td>
        <td>${n.nota>=6?'<span class="pill pill-ok">Aprovado</span>':'<span class="pill pill-late">Em recuperação</span>'}</td></tr>`).join('')}
      </table></div></div>`;
  }

  else if(state.page==='calendario'){
    html += `<div class="card"><div class="card-header">Novembro 2026</div><div class="card-body">
      <div class="field-row"><label>07/11</label><input disabled value="Abertura do fórum - Bioinformática"></div>
      <div class="field-row"><label>14/11</label><input disabled value="Prova - Gestão de Agronegócios"></div>
      <div class="field-row"><label>20/11</label><input disabled value="Prova - Estatística Experimental"></div>
      <div class="field-row"><label>30/11</label><input disabled value="Encerramento do semestre letivo"></div>
    </div></div>`;
  }

  else if(state.page==='mensagens'){
    html += `<div class="card"><div class="card-body" style="padding:0">
      ${MENSAGENS.map(mm=>`<div class="msg-item ${mm.lida?'':'msg-unread'}">
        <span>${mm.de} — ${mm.assunto}</span><span>${mm.lida?'Lida':'Não lida'}</span></div>`).join('')}
    </div></div>`;
  }

  else if(state.page==='perfil'){
    html += `<div class="card"><div class="card-header">Dados do Estudante</div><div class="card-body">
      <div class="field-row"><label>Nome completo</label><input disabled value="Bruno Henrique Deraújo"></div>
      <div class="field-row"><label>RU</label><input disabled value="0004521"></div>
      <div class="field-row"><label>Curso</label><input disabled value="Tecnólogo em Agronegócio"></div>
      <div class="field-row"><label>E-mail institucional</label><input disabled value="bruno.deraujo@Uninter.edu.br"></div>
    </div></div>`;
  }

  else if(state.page==='configuracoes'){
    html += `<div class="tabs">
      <div class="tab active">Dados Pessoais</div>
      <div class="tab" onclick="goPage('perfil')">Preferências</div>
      <div class="tab" onclick="goPage('perfil')">Escolaridade</div>
    </div>
    <div class="card"><div class="card-header">Foto do perfil e Tema</div><div class="card-body">
      <div class="notice">A opção de troca de tema da interface está em fase BETA. Caso identifique algum problema, contate o suporte na tela inicial.</div>
      <div class="field-row"><label>Tema</label>
        <select id="temaSel" onchange="state.tema=this.value; save(); toast('Tema atualizado: '+this.value)">
          <option ${state.tema==='Tema padrão'?'selected':''}>Tema padrão</option>
          <option ${state.tema==='Tema escuro'?'selected':''}>Tema escuro</option>
          <option ${state.tema==='Alto contraste'?'selected':''}>Alto contraste</option>
        </select>
      </div>
      <div class="field-row"><label>Nome</label><input disabled value="Bruno Henrique Deraújo"></div>
      <button class="btn btn-primary" onclick="toast('Alterações salvas')">Salvar alterações</button>
    </div></div>
    <div class="card"><div class="card-header">Notificações</div><div class="card-body">
      <div class="field-row"><label>Notificações por e-mail</label>
        <select onchange="state.prefs.emailNotif=(this.value==='Ativado'); save()">
          <option ${state.prefs.emailNotif?'selected':''}>Ativado</option>
          <option ${!state.prefs.emailNotif?'selected':''}>Desativado</option>
        </select></div>
      <div class="field-row"><label>Notificações por SMS</label>
        <select onchange="state.prefs.smsNotif=(this.value==='Ativado'); save()">
          <option ${!state.prefs.smsNotif?'selected':''}>Desativado</option>
          <option ${state.prefs.smsNotif?'selected':''}>Ativado</option>
        </select></div>
      <button class="btn btn-link" onclick="localStorage.removeItem(STORE_KEY); location.reload()">Restaurar configurações padrão</button>
    </div></div>`;
  }

  m.innerHTML = html;
}

renderNav();
renderMain();
document.getElementById('bellIcon').innerHTML = SVG.bell;
document.getElementById('chatIcon').innerHTML = SVG.chat;
</script>
</body>
</html>
